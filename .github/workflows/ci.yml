name: CI

# The only place this project is compiled. There is no Rust toolchain on any
# development machine (Harness §1), so a red build here is the first notification
# that anything is wrong.

# Documentation and the test plan do not reach the build. A Mac runner is
# scarce, so a newer push replaces the run still going for the previous one.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'testing/test-plan.yaml']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'testing/test-plan.yaml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tier (dictate-core on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Compiling and testing the core on Linux is what enforces FR-20.3: if a
      # Windows-only dependency ever reaches dictate-core, this job stops, and
      # the testable half of the project cannot quietly slip out of CI.
      # The platform heads build here as stubs, so the whole workspace is checked.
      - name: Test
        run: cargo test --workspace --all-targets --locked

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p dictate-windows --locked

      # The core again, on the platform it ships on.
      - name: Test core
        run: cargo test -p dictate-core --locked

      # Every push to main leaves a runnable exe, so a fix can be tried on the
      # desktop without cutting a release.
      - name: Upload dictate.exe
        uses: actions/upload-artifact@v4
        with:
          name: dictate-exe
          path: target/release/dictate.exe
          if-no-files-found: error

  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test core
        run: cargo test -p dictate-core --locked

      # Signed and notarized when the Developer ID secrets are set, so the
      # artifact runs like a release; ad-hoc signed otherwise (pull requests
      # from forks never see the secrets).
      - name: Build dictate.app
        env:
          LOCKED: 1
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash dictate-macos/bundle/build-app.sh "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"

      - name: Upload dictate.app
        uses: actions/upload-artifact@v4
        with:
          name: dictate-macos
          path: target/dictate-macos.zip
          if-no-files-found: error
