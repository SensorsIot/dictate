name: CI

# The only place this project is compiled. There is no Rust toolchain in the
# devcontainer (Harness §1), so a red build here is the first notification
# that anything is wrong.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tier (dictate-core on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Compiling and testing the core on Linux is what enforces FR-20.3: if a
      # Windows-only dependency ever reaches dictate-core, this job stops, and
      # the testable half of the project cannot quietly slip out of CI.
      # dictate-windows builds here as a stub, so the whole workspace is checked.
      - name: Test
        run: cargo test --workspace --all-targets

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p dictate-windows

      # The core again, on the platform it ships on.
      - name: Test core
        run: cargo test -p dictate-core

      # Every push to main leaves a runnable exe, so a fix can be tried on the
      # desktop without cutting a release.
      - name: Upload dictate.exe
        uses: actions/upload-artifact@v4
        with:
          name: dictate-exe
          path: target/release/dictate.exe
          if-no-files-found: error
