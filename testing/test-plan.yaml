    status: designed

  - id: DT-16
    name: Consecutive dictations are separated, in consoles as well as elsewhere
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-6.4]
    status: implemented
    last_result: fail        # against 0.1.3
    evidence: >
      Matched pair on the Windows machine, 2026-08-16: identical 214-character
      text, same run, differing only in destination —
        n=8  target=msedge           console=False  delivered 215  (+1)
        n=9  target=WindowsTerminal  console=True   delivered 214  (+0)
      The separator was suppressed for console targets. Fixed in 0.1.4; the
      host-tier test The_separator_applies_in_consoles_too now pins it.
    note: >
      Retest against 0.1.4. Kept as a desktop case rather than closed on the
      unit test: the unit test proves the string is built with a space, not that
      the space reaches a terminal.

  - id: DT-17
    name: Handles, threads and working set plateau across a long session
    kind: atomic
    scenario: standard
    tier: desktop
    verifies: [NFR-19.3, NFR-19.4]
    status: implemented
    last_result: pass
    evidence: >
      Nine utterances on the Windows machine, 2026-08-16: handles oscillating in
      a 709-753 band with no trend, threads near the starting 21, working set
      flat around 91 MB. The earlier 45->97 MB reading was pool and JIT warm-up
      settling. KeepMicrophoneOpen not required to hold it flat.

  - id: DT-13
    name: Surrogate-pair characters are typed correctly
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-12.2]
    status: designed

  - id: DT-14
    name: Elevated foreground window produces a reported failure, not silence
    kind: atomic
    scenario: negative
    tier: desktop
    verifies: [FR-12.4]
    status: designed

  - id: DT-15
    name: Published exe runs on a machine with no .NET installed
    kind: atomic
    scenario: standard
    tier: desktop
    verifies: [FR-20.4]
    status: designed

  - id: DT-18
    name: A press whose key-up never arrives is released within a second
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7]
    # Oracle: the Windows consent store, which is what drives the taskbar
    # microphone indicator. LastUsedTimeStop == 0 means the device is still open.
    #   HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager
    #     \ConsentStore\microphone\NonPackaged\C:#...#dictate.exe
    oracle: consent-store LastUsedTimeStop becomes non-zero after release
    status: designed

  - id: DT-22
    name: A press after a long idle is not delayed by the output device opening
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [NFR-19.5]
    # Caught on 0.1.12: recording.start carried timestamp 22:10:14.823 while its
    # own measurements put the key-press at 22:10:11.498 — a 3.2 s UI-thread
    # block inside the first WaveOut open, which also cost most of the audio.
    oracle: recording.start timestamp minus (stop timestamp - held) < 250ms
    status: designed

  - id: DT-21
    name: A suppressed hotkey held for three seconds is one session, not eleven
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7, FR-5.2]
    # Regression: with SuppressHotkey on, the system key state reads "up" for the
    # whole hold, so reconciling on it alone fragments the hold into ~250 ms
    # sessions that are each discarded as a tap. Observed on 0.1.10.
    oracle: exactly one recording.start; recording.stop reason=Released held≈3000ms
    status: designed

  - id: DT-19
    name: A hotkey synthesised by another process is recorded as injected
    kind: atomic
    scenario: negative
    tier: desktop
    verifies: [FR-8.6]
    oracle: recording.start logs injected=True; with IgnoreInjectedHotkey on, hotkey.rejected instead
    status: designed

  - id: DT-20
    name: The capture device is released after every press across a hundred cycles
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7, FR-9.4]
    # The leak this catches is intermittent — a race between StopRecording and
    # Dispose — so one cycle proves nothing. Watch mic.close confirmed=False.
    oracle: consent-store LastUsedTimeStop non-zero after each cycle; no mic.close confirmed=False
    status: designed

  # ---- workflow: the acceptance gate -----------------------------------------

  - id: W-01
    name: Standard journey — launch to typed sentence
    kind: workflow
    scenario: standard
    tier: desktop
    verifies: [FR-5.1, FR-6.1, FR-9.2, FR-10.1, FR-11.1, FR-11.3, FR-14.1, FR-17.1]
    steps: docs/Functionality/FSD.md §1.3
    must_not:
      - the first syllable is missing
      - the text is translated
      - any file is written
    status: implemented        # as a manual procedure
    last_result: partial
    evidence: user-reported, 2026-08-16 — "the dictation works"
    evidence_quality: weak
    note: >
      Deliberately independent of its children. Every atomic test above can pass
      while this one fails — each of those arranges the rig to suit itself,
      whereas this proves that what one step produces is what the next consumes.
    steps_demonstrated: 1-7    # launch through text appearing at the caret
    steps_outstanding:
      - step 8 — no audio or transcript file written anywhere (FR-17.1).
        Nobody has looked. A working pipeline says nothing about what it left
        on disk, and this is the one claim in the README that a user cannot
        check for themselves.

# ---- honest position --------------------------------------------------------
#
# As of run 31955257714 (2026-08-16), 41 assertions across 12 host tests pass on
# ubuntu-latest, and the whole solution — including the Windows head — compiles.
#
#   host      16 implemented, all passing · 3 designed
#   ci         1 passing (C-01) · 1 never run (C-02, needs a tag)
#   desktop   15 designed · 2 executed (DT-16 fail on 0.1.3 then fixed, DT-17 pass)
#   workflow   1, blocked on O-01
#
# What that does and does not mean. Verified: the pure logic — sanitisation,
# degradation, WAV framing, response parsing, prompt construction — plus the fact
# that Dictate.Core carries no Windows dependency.
#
# Since first release the desktop tier has begun reporting. Discharged by
# measurement on the Windows machine: press-to-capture latency (46 ms external,
# 7-9 ms internal, against a 300 ms hook budget), capture bracketing the hold to
# within 34 ms, and the memory plateau above. Nine consecutive utterances
# completed with status=Ok.
#
# Still NOT verified, and it is a lot: focus-change fallback, the console
# newline prohibition end to end, elevated-window failure reporting, surrogate
# pairs, the recording cap, and the no-persistence audit (FR-17.1) that nobody
# has yet looked for. Those need the Windows machine and a human.
