  - id: DT-18
    name: A press whose key-up never arrives is released within a second
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7]
    oracle: >
      recording.stop reason=Reconciled within about a second of the release,
      then mic.close confirmed=True, and the microphone indicator in the
      taskbar goes out
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19, CI build of run 39230101905, by the user from Windows
      Terminal into an administrator PowerShell, twice: recording.stop
      reason=Reconciled both times, then mic.close confirmed=True. The second
      carried speech and went to the clipboard with reason=focus-changed
      (FR-6.2); the first was too short to recognise.
    note: >
      Expect the Start menu to open on the release: suppression cannot apply to
      input the hook never sees. It did, both times.
    steps: >
      Needs the key-up to be genuinely lost, which means UIPI rather than a
      trick: open a window running as administrator, hold the hotkey, click into
      the elevated window while still holding, release it there. With
      EnableDiagnosticLog on, read the recording.stop and mic.close lines.

  - id: DT-22
    name: A press after a long idle is not delayed by a first-use cost
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [NFR-19.5]
    # recording.start's own timestamp against the press time implied by `held` on
    # the matching stop. They diverge when something blocks the UI thread — an
    # audio-device open being the case that costs audio as well as latency.
    oracle: recording.start timestamp minus (stop timestamp - held) < 250ms
    steps: >
      Start dictate, leave it idle for several minutes, then press and hold.
      Compute the press time from the stop line as (stop timestamp - held) and
      compare it against the recording.start timestamp. Repeat immediately for a
      second press: the pair separates a first-use cost from a recurring one.
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19, first press after 8.6 minutes idle: recording.start
      10:07:50.891 against a press implied at 10:07:50.889 (stop 10:07:59.903,
      held 9014 ms) — 2 ms.

  - id: DT-21
    name: A suppressed hotkey held for three seconds is one session, not eleven
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7, FR-5.2]
    # With SuppressHotkey on the system key state reads "up" for the whole hold,
    # so reconciling on it alone fragments the hold into tick-length sessions,
    # each discarded as a tap. Auto-repeat is the signal that must carry it.
    oracle: exactly one recording.start; recording.stop reason=Released held≈3000ms
    steps: >
      Must be a human finger. keybd_event cannot stand in: synthetic keys do not
      auto-repeat, and auto-repeat is the liveness signal a suppressed hold
      depends on, so any synthetic hold longer than graceInitial is cut short by
      the reconciler and the test measures the harness rather than the product.
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19 with SuppressHotkey on: holds of 1.4-9.0 s, each a single
      recording.start ending recording.stop reason=Released. No hold was
      fragmented into tap-length sessions.

  - id: DT-19
    name: A hotkey synthesised by another process is recorded as injected
    kind: atomic
    scenario: negative
    tier: desktop
    verifies: [FR-8.6]
    oracle: recording.start logs injected=True; with IgnoreInjectedHotkey on, hotkey.rejected instead
    steps: >
      keybd_event(0x5C, 0, 0, 0) to press and (..., 2, ...) to release, from any
      unelevated process. Note that only the injected flag is under test here —
      see DT-21 on why a synthetic press cannot stand in for a real hold.
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19, v0.2.0, keybd_event(0x5C) from an unelevated PowerShell:
        IgnoreInjectedHotkey off:  recording.start  injected=True  lowerIL=False
        IgnoreInjectedHotkey on:   hotkey.rejected  reason=injected  lowerIL=False,
                                   no recording.start
      The hotkey was not left down in either case.

  - id: DT-20
    name: The capture device is released after every press across a hundred cycles
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7, FR-9.4]
    # The leak this catches is intermittent — a close racing buffers the driver
    # still holds — so one cycle proves nothing. Watch mic.close confirmed=False.
    oracle: one mic.close confirmed=True per press; no mic.close confirmed=False
    steps: >
      Tap the hotkey a hundred times, more than 3 s apart so the linger
      (FR-9.5) does not keep one device open across taps, then count mic.close
      lines in the log. Taps below MinimumHoldMs are fine and cheapest — the
      device still opens and closes on each one.
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19, v0.2.0: 150 injected taps 3.6 s apart, longer than the 3 s
      linger, so each opened and closed a device, and each released before the
      open had finished. 150 recording.start, 150 recording.discarded,
      150 mic.close confirmed=True, no confirmed=False, no mic.openFailed, no
      utterance sent. Handles 231 -> 285 over the first 100 (warm-up), then
      282 -> 287 over the next 50; working set 19.5-19.7 MB.

  - id: DT-23
    name: A hotkey held while dictate starts does not leave the key stuck down
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.4]
    # Suppression must be symmetric. If the key-down reached the system before
    # the hook existed, swallowing the key-up strands the modifier down and every
    # later keystroke becomes a chord.
    oracle: GetAsyncKeyState(hotkey) reports up after the release
    steps: >
      With dictate not running, press and hold the hotkey; confirm
      GetAsyncKeyState reports it down. Start dictate, wait for the tray icon,
      then release. Read GetAsyncKeyState again. keybd_event is a valid stand-in
      here — the test is about which half of the pair the hook swallows, not
      about hold duration.
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19, v0.2.0, SuppressHotkey on, hotkey 0x5C:
        key down, dictate not running -> GetAsyncKeyState reports down: True
        dictate started, key released  -> GetAsyncKeyState reports down: False
      No recording.start for the held key.

  - id: DT-24
    name: Start with Windows registers, survives a login, and unregisters
    kind: atomic
    scenario: standard
    tier: desktop
    verifies: [FR-16.3]
    must_not: the check mark disagreeing with what starts at login
    oracle: >
      HKCU\Software\Microsoft\Windows\CurrentVersion\Run has a "dictate"
      value with the exe's quoted path exactly while the box is ticked, and
      dictate is running after the next login
    steps: >
      With no Startup-folder shortcut: tick the box, read the Run value, log
      out and in, confirm dictate runs, untick, confirm the value is gone.
      With a dictate shortcut in shell:startup: the box shows ticked; ticking
      adds no Run value; unticking removes the shortcut.
    status: implemented
    last_result: partial
    evidence: >
      2026-10-19, CI build of run 39255922791, by the user: with a dictate
      shortcut in shell:startup the box shows ticked. Toggling not yet
      exercised: the log holds no autostart event, the shortcut is unchanged
      and there is no Run value.

  - id: DT-25
    name: A second launch reports dictate is running and exits
    kind: atomic
    scenario: negative
    tier: desktop
    verifies: [FR-5.4]
    must_not: two dictate processes holding a hook
    oracle: >
      the second process shows "dictate is already running", exits with code 0,
