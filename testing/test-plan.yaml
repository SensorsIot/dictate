# dictate — test plan
#
# One entry per test: its tier, the requirements it discharges, what it needs,
# and what it last produced. The traceability matrix is generated from this file
# plus @fsd tags in the source. Never hand-maintain a "covered" column.
#
# status:      designed | implemented | blocked
# last_result: never_run | pass | fail   (+ run_id when evidence exists)
#
# A test that is `implemented` but `never_run` discharges nothing. That is the
# honest position for every host test below: there is no .NET SDK in the
# devcontainer (decisions.md D-15), so nothing here has executed yet. The first
# CI run on push is what turns these green — or not.

version: 1
updated: 2026-08-16

tiers:
  host:
    runs_on: ubuntu-latest
    trigger: every push
    reaches: Dictate.Core only
  ci:
    runs_on: windows-latest
    trigger: tag push
    reaches: compilation and publish
  desktop:
    runs_on: the user's Windows 11 machine
    trigger: by hand
    reaches: hotkey, microphone, SendInput, focus, tray
    automatable: false
    why_not: >
      Needs a real low-level keyboard hook, a real input device and a real
      foreground window. No CI runner in this project's infrastructure provides
      any of the three. Stated rather than implied so nobody looks for the job.

tests:

  # ---- host tier: implemented -----------------------------------------------

  - id: H-01
    name: Console target collapses every newline to a space
    kind: atomic
    scenario: negative
    tier: host
    file: tests/Dictate.Core.Tests/TextSanitizerTests.cs
    verifies: [FR-6.4]
    must_not: any \r or \n survives into text bound for a console
    status: implemented
    last_result: pass        # run 31955257714, 2026-08-16
    note: >
      The highest-consequence test in the suite. A newline typed into a shell is
      Enter, and Enter runs whatever is on the line.

  - id: H-02
    name: Non-console target keeps paragraphs, capping blank runs at one
    kind: atomic
    scenario: standard
    tier: host
    file: tests/Dictate.Core.Tests/TextSanitizerTests.cs
    verifies: [FR-6.4]
    status: implemented
    last_result: pass        # run 31955257714, 2026-08-16

  - id: H-03
    name: Console classification by process name, class and user list
    kind: atomic
    scenario: standard
    tier: host
    file: tests/Dictate.Core.Tests/TextSanitizerTests.cs
    verifies: [FR-6.5]
    status: implemented
    last_result: pass        # run 31955257714, 2026-08-16
    gap: >
      Covers the process-name and user-list arms only. The ConsoleWindowClass arm
      lives in Dictate.Windows and is unreachable from the host tier — see D-05.

  - id: H-04
    name: Cleanup failure falls back to the raw transcript
    kind: atomic
    scenario: deviation
    tier: host
    file: tests/Dictate.Core.Tests/PipelineTests.cs
    verifies: [FR-7.1]
    must_not: the utterance is dropped, or an exception escapes the pipeline
    status: implemented
    last_result: pass        # run 31955257714, 2026-08-16

  - id: H-05
