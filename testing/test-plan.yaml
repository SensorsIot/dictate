# dictate — test plan
#
# One entry per test: its tier, the requirements it discharges, what it needs,
# and what it last produced. The traceability matrix is generated from this file
# plus @fsd tags in the source. Never hand-maintain a "covered" column.
#
# Test ids: H- host · C- CI · DT- desktop · W- workflow.
#
# status:      designed | implemented | blocked
# last_result: never_run | pass | fail   (+ run_id when evidence exists)
#
# A test that is `implemented` but `never_run` discharges nothing. There is no
# .NET SDK in the devcontainer (Harness §0), so the host tier only ever
# executes in CI, and the desktop tier only ever on the Windows machine by hand.
# Read `last_result`, not `status`.

version: 1
updated: 2026-08-16

tiers:
  host:
    runs_on: ubuntu-latest
    trigger: every push
    reaches: Dictate.Core only
  ci:
    runs_on: windows-latest
    trigger: tag push
    reaches: compilation and publish
  desktop:
    runs_on: the user's Windows 11 machine
    trigger: by hand
    reaches: hotkey, microphone, SendInput, focus, tray
    automatable: false
    why_not: >
      Needs a real low-level keyboard hook, a real input device and a real
      foreground window. No CI runner in this project's infrastructure provides
      any of the three. Stated rather than implied so nobody looks for the job.

