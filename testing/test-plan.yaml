  # ---- workflow: the acceptance gate -----------------------------------------

  - id: W-01
    name: Standard journey — launch to typed sentence
    kind: workflow
    scenario: standard
    tier: desktop
    verifies: [FR-5.1, FR-6.1, FR-9.2, FR-10.1, FR-11.1, FR-11.3, FR-14.1, FR-17.1]
    steps: docs/Functionality/FSD.md §1.3
    must_not:
      - the first syllable is missing
      - the text is translated
      - any file is written
    status: blocked
    blocked_by: O-01
    note: >
      Deliberately independent of its children. Every atomic test above can pass
      while this one fails — each of those arranges the rig to suit itself,
      whereas this proves that what one step produces is what the next consumes.
      Blocked until the user confirms the journey in FSD §1.3 is the run they
      actually expect.

# ---- honest position --------------------------------------------------------
#
# As of run 31955257714 (2026-08-16), 41 assertions across 12 host tests pass on
# ubuntu-latest, and the whole solution — including the Windows head — compiles.
#
#   host      12 implemented, all passing · 3 designed
#   ci         1 passing (C-01) · 1 never run (C-02, needs a tag)
#   desktop   15 designed, 0 implemented, 0 executed
#   workflow   1, blocked on O-01
#
# What that does and does not mean. Verified: the pure logic — sanitisation,
# degradation, WAV framing, response parsing, prompt construction — plus the fact
# that Dictate.Core carries no Windows dependency.
#
# NOT verified, and this is most of the product: no keystroke has ever been
# synthesised, no microphone opened, no hotkey pressed, and neither ElevenLabs
# nor Anthropic has been called with a real key. Every requirement resting on
# those sits at "test designed". The desktop tier is where they get discharged,
# and it needs the Windows machine and a human.
