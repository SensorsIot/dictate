  - id: DT-18
    name: A press whose key-up never arrives is released within a second
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7]
    # Oracle: the Windows consent store, which is what drives the taskbar
    # microphone indicator. LastUsedTimeStop == 0 means the device is still open.
    #   HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager
    #     \ConsentStore\microphone\NonPackaged\C:#...#dictate.exe
    oracle: consent-store LastUsedTimeStop becomes non-zero after release
    status: implemented
    last_result: pass
    evidence: >
      On the Windows machine, hotkey held in a normal window until the overlay
      showed, focus moved to an elevated PowerShell by clicking it, key released
      there:
        recording.start  pressToCapture=101ms
        recording.stop   reason=Reconciled  held=11458ms
        mic.close        confirmed=True
      The key-up never reached the hook and the reconciler ended the session; the
      consent store recorded the capture handle released. Note the Start menu
      opens on the release, since suppression cannot apply to input the hook
      never sees.
    steps: >
      Needs the key-up to be genuinely lost, which means UIPI rather than a
      trick: open a window running as administrator, hold the hotkey, click into
      the elevated window while still holding, release it there. Read
      LastUsedTimeStop under ConsentStore\microphone\NonPackaged for dictate.exe
      before and after.

  - id: DT-22
    name: A press after a long idle is not delayed by a first-use cost
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [NFR-19.5]
    # recording.start's own timestamp against the press time implied by `held` on
    # the matching stop. They diverge when something blocks the UI thread — an
    # audio-device open being the case that costs audio as well as latency.
    oracle: recording.start timestamp minus (stop timestamp - held) < 250ms
    steps: >
      Start dictate, wait past FeedbackIdleSeconds, then press and hold. Compute
      the press time from the stop line as (stop timestamp - held) and compare it
      against the recording.start timestamp. Repeat immediately for a second
      press: the pair separates a first-use cost from a recurring one.
    status: implemented
    last_result: fail
    evidence: >
      Two consecutive presses on the Windows machine against 0.1.16, first
      dictation after a fresh start:
        press 1  recording.start 23:24:00.764, press implied 23:24:00.149 -> 615ms
        press 2  recording.start 23:24:34.974, press implied 23:24:34.964 ->  10ms
      So a first-use cost, not a recurring one, and not the output device — that
      had already opened at startup (feedback.open took=3306ms, logged 23:20:40).
      What remains between _recorder.Start returning and the log line is
      SetState, whose ShowState performs the overlay's first real Show. PreWarm
      creates the overlay handle but never shows the window, so layout and paint
      are still paid on the first dictation.

  - id: DT-21
    name: A suppressed hotkey held for three seconds is one session, not eleven
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7, FR-5.2]
    # With SuppressHotkey on the system key state reads "up" for the whole hold,
    # so reconciling on it alone fragments the hold into tick-length sessions,
    # each discarded as a tap. Auto-repeat is the signal that must carry it.
    oracle: exactly one recording.start; recording.stop reason=Released held≈3000ms
    steps: >
      Must be a human finger. keybd_event cannot stand in: synthetic keys do not
      auto-repeat, and auto-repeat is the liveness signal a suppressed hold
      depends on, so any synthetic hold longer than graceInitial is cut short by
      the reconciler and the test measures the harness rather than the product.
    status: implemented
    last_result: pass
    evidence: >
      Three-second hold on the Windows machine with SuppressHotkey on: one
      recording.start, recording.stop reason=Released held=3564ms. Six
      consecutive utterances afterwards were each a single session, holds of
      1668-10302ms, every stop reason=Released.

  - id: DT-19
    name: A hotkey synthesised by another process is recorded as injected
    kind: atomic
    scenario: negative
    tier: desktop
    verifies: [FR-8.6]
    oracle: recording.start logs injected=True; with IgnoreInjectedHotkey on, hotkey.rejected instead
    steps: >
      keybd_event(0x5C, 0, 0, 0) to press and (..., 2, ...) to release, from any
      unelevated process. Note that only the injected flag is under test here —
      see DT-21 on why a synthetic press cannot stand in for a real hold.
    status: implemented
    last_result: pass
    evidence: >
      Synthetic press against 0.1.16, IgnoreInjectedHotkey off:
        recording.start  pressToCapture=10ms  injected=True  lowerIL=False
      The second half of the oracle — hotkey.rejected with the setting on — is
      not yet exercised.

  - id: DT-20
    name: The capture device is released after every press across a hundred cycles
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.7, FR-9.4]
    # The leak this catches is intermittent — a race between StopRecording and
    # Dispose — so one cycle proves nothing. Watch mic.close confirmed=False.
    oracle: consent-store LastUsedTimeStop non-zero after each cycle; no mic.close confirmed=False
    steps: >
      Tap the hotkey repeatedly for a minute, then read the consent-store key and
      grep the log for mic.close confirmed=False. Taps below MinimumHoldMs are
      fine and cheapest — the device still opens and closes on each one.
    status: designed
    last_result: never_run
    note: >
      Around twenty consecutive open/close cycles have been observed clean,
      including eleven inside three seconds, every one mic.close confirmed=True.
      Encouraging, but well short of the count this test asks for, and the race
      it targets is intermittent.

  - id: DT-24
    name: A cold output device does not delay the microphone's first buffer
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [NFR-19.6]
    oracle: mic.firstBuffer under 250ms on a press where feedback.open also occurs
    steps: >
      Set FeedbackIdleSeconds to 10, restart, wait past it so the device closes,
      then press. Both feedback.open and mic.firstBuffer appear on the same
      press; the test is whether they are independent.
    status: implemented
    last_result: pass
    evidence: >
      Against 0.1.17, output device closed by a 10 s idle timeout:
        recording.start  pressToCapture=5ms
        feedback.open    took=12ms
        mic.firstBuffer  after=75ms
      Capture unaffected. The same test against 0.1.16, where both APIs were
      winmm, gave feedback.open took=3220ms and mic.firstBuffer after=3258ms —
      34 ms apart, and roughly 3.2 s of the utterance lost.

  - id: DT-23
    name: A hotkey held while dictate starts does not leave the key stuck down
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.4]
    # Suppression must be symmetric. If the key-down reached the system before
    # the hook existed, swallowing the key-up strands the modifier down and every
    # later keystroke becomes a chord.
    oracle: GetAsyncKeyState(hotkey) reports up after the release
    steps: >
      With dictate not running, press and hold the hotkey; confirm
      GetAsyncKeyState reports it down. Start dictate, wait for the tray icon,
      then release. Read GetAsyncKeyState again. keybd_event is a valid stand-in
      here — the test is about which half of the pair the hook swallows, not
      about hold duration.
    status: implemented
    last_result: pass
    evidence: >
      Synthetic run against 0.1.13 with SuppressHotkey on, hotkey 0x5C:
        key down, dictate not running -> GetAsyncKeyState reports down: True
        dictate started, key released  -> GetAsyncKeyState reports down: False
      The same sequence against 0.1.12 left the key stranded down.

  # ---- workflow: the acceptance gate -----------------------------------------

  - id: W-01
    name: Standard journey — launch to typed sentence
    kind: workflow
    scenario: standard
    tier: desktop
    verifies: [FR-5.1, FR-6.1, FR-9.2, FR-10.1, FR-11.1, FR-11.3, FR-14.1, FR-17.1]
    steps: docs/Functionality/FSD.md §1.3
    must_not:
      - the first syllable is missing
      - the text is translated
      - any file is written
    status: implemented        # as a manual procedure
    last_result: partial
    evidence: user-reported, 2026-08-16 — "the dictation works"
    evidence_quality: weak
    note: >
      Deliberately independent of its children. Every atomic test above can pass
      while this one fails — each of those arranges the rig to suit itself,
      whereas this proves that what one step produces is what the next consumes.
    steps_demonstrated: 1-7    # launch through text appearing at the caret
    steps_outstanding:
      - step 8 — no audio or transcript file written anywhere (FR-17.1).
        Nobody has looked. A working pipeline says nothing about what it left
        on disk, and this is the one claim in the README that a user cannot
        check for themselves.

# ---- honest position --------------------------------------------------------
#
# 71 assertions across the host tests pass on ubuntu-latest on every push, and
# the whole solution — including the Windows head — compiles.
#
#   host      16 implemented, all passing · 3 designed
#   ci         1 passing (C-01) · 1 never run (C-02, needs a tag)
#   desktop   6 executed (DT-16 fail, DT-17 DT-19 DT-21 DT-23 pass, DT-22 fail)
#             · the rest designed, each with steps a human can follow
#   workflow   1 designed (W-01), acceptance gate
#
# The desktop tier is manual by decision, not by omission — see tiers.desktop.
# `designed` there means the procedure is written and nobody has run it, not
# that code is missing.
#
# What that does and does not mean. Verified: the pure logic — sanitisation,
# degradation, WAV framing, response parsing, prompt construction — plus the fact
# that Dictate.Core carries no Windows dependency.
#
# Since first release the desktop tier has begun reporting. Discharged by
# measurement on the Windows machine: press-to-capture latency (46 ms external,
# 7-9 ms internal, against a 300 ms hook budget), capture bracketing the hold to
# within 34 ms, and the memory plateau above. Nine consecutive utterances
# completed with status=Ok.
#
# Still NOT verified, and it is a lot: focus-change fallback, the console
# newline prohibition end to end, elevated-window failure reporting, surrogate
# pairs, the recording cap, and the no-persistence audit (FR-17.1) that nobody
# has yet looked for. Those need the Windows machine and a human.
