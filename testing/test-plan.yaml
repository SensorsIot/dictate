  - id: DT-26
    name: The hotkey in an administrator window closes Start and explains
    kind: atomic
    scenario: deviation
    tier: desktop
    verifies: [FR-8.8]
    must_not: closing a Start menu opened from an ordinary window or by a click
    oracle: >
      start.closed ok=True in the log, the Start menu gone, and the
      "Administrator window" notification shown
    steps: >
      Press and release the hotkey in an administrator PowerShell. Then, as the
      negative: press the other Windows key in an ordinary window, and click
      the Start button while the administrator window has focus — Start must
      stay open both times and the log gain no start.closed.
    status: implemented
    last_result: pass
    evidence: >
      2026-10-19, CI build of run 39255922791, by the user: one start.closed
      ok=True at 15:03:00, no retry needed, Start gone and the notification
      shown. The user reported the steps working; the log holds no other
      start.closed, so nothing else was closed.

  # ---- workflow: the acceptance gate -----------------------------------------

  - id: W-01
    name: Standard journey — launch to typed sentence
    kind: workflow
    scenario: standard
    tier: desktop
    verifies: [FR-5.1, FR-6.1, FR-9.2, FR-10.1, FR-11.1, FR-11.3, FR-14.1, FR-17.1]
    steps: docs/Functionality/dictate_FSD.md §1.3
    must_not:
      - the first syllable is missing
      - the text is translated
      - any file is written
    status: implemented        # as a manual procedure
    last_result: partial
    evidence: >
      2026-10-19: launch, press, speech, release and text at the caret, in a
      browser and two terminals, in German and English.
    note: >
      Deliberately independent of its children. Every atomic test above can pass
      while this one fails — each of those arranges the rig to suit itself,
      whereas this proves that what one step produces is what the next consumes.
    steps_demonstrated: 1-7    # launch through text appearing at the caret
    steps_outstanding:
      - step 8 — no audio or transcript file written anywhere (FR-17.1).
        Nobody has looked. A working pipeline says nothing about what it left
        on disk, and this is the one claim in the README that a user cannot
        check for themselves.

# ---- honest position --------------------------------------------------------
#
# 75 host tests pass on ubuntu-latest on every push, and the whole workspace —
# including the Windows head — builds on windows-latest.
#
#   host      18 implemented (H-01..H-18), all passing
#   ci         2 passing (C-01, C-02)
#   desktop    DT-01 DT-02 DT-04 DT-16 DT-19 DT-20 DT-21 DT-22 DT-23 DT-25 pass
#             · DT-17 partial
#             · the rest written as procedures, not yet run
#   workflow   W-01 partial (step 8 outstanding)
#
# The desktop tier is manual by decision, not by omission — see tiers.desktop.
# `designed` or `never_run` there means the procedure is written and nobody has
# run it, not that code is missing.
#
# Verified: the pure logic — sanitisation, degradation, WAV framing, response
# parsing, prompt construction, configuration — plus the fact that
# dictate-core carries no Windows dependency. On the desktop: the hotkey and
